name: Streamlit app checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py train_model.py pcos.py tests
      - name: Validate model artefacts and inference
        run: python tests/test_model_artifacts.py
      - name: Generate refreshed PDF report
        run: python tests/test_pdf_report.py
      - name: Launch app smoke test
        run: python tests/test_app_smoke.py
